name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels its older run. Runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: make lint
      - run: mvn -B -ntp test jacoco:report dependency:copy-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            target/classes
            target/test-classes
            target/dependency
            target/site/jacoco/jacoco.xml
          retention-days: 3
  # SonarQube Cloud analysis with the JaCoCo report. The job fails when the
  # quality gate fails (sonar.qualitygate.wait in sonar-project.properties).
  sonar:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target
      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
