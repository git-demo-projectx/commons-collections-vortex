name: Upstream tests
# Experiment check, run by hand: replaces the bloomfilter test sources of a
# branch with the ones from an upstream Apache commit, then runs them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to check
        required: true
      upstream:
        description: Upstream commit whose bloomfilter tests to run
        required: true
permissions:
  contents: read
jobs:
  upstream-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM: ${{ inputs.upstream }}
      TESTS: src/test/java/org/apache/commons/collections4/bloomfilter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Use the upstream bloomfilter tests
        run: |
          git fetch --depth 1 https://github.com/apache/commons-collections.git "$UPSTREAM"
          rm -rf "$TESTS"
          git checkout FETCH_HEAD -- "$TESTS"
      - run: mvn -B -ntp -q test -Dtest='org.apache.commons.collections4.bloomfilter.**' -Dsurefire.failIfNoSpecifiedTests=false
